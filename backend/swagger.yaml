openapi: 3.0.3
info:
  title: Warehouse Management MVC API
  description: Complete API Documentation for the Warehouse Management System, including User Management, RBAC Permissions, Products, Receipts, Deliveries, Stocktake, Adjustments, Incidents, Dashboard Stats, and Notifications.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
paths:
  # --- Authentication ---
  /auth/register:
    post:
      summary: Register a new user
      description: Open registration endpoint for creating the first or subsequent users.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
              properties:
                username:
                  type: string
                  example: admin
                email:
                  type: string
                  format: email
                  example: admin@company.com
                password:
                  type: string
                  format: password
                  description: Password must be >=8 chars, containing 1 uppercase, 1 digit, and 1 special character.
                  example: P@ssw0rd2026
                role:
                  type: string
                  enum: [Admin, QuanLyKho, KeToanKho, NhanVienKho, QC, Sale]
                  default: NhanVienKho
                  example: Admin
      responses:
        '201':
          description: Registration successful, returns user info and JWT token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: User already exists or validation error.

  /auth/login:
    post:
      summary: Login user
      description: Login using email or username. Protects against brute force (locks account after 5 failed attempts for 10 minutes).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - emailOrUsername
                - password
              properties:
                emailOrUsername:
                  type: string
                  example: admin@company.com
                password:
                  type: string
                  format: password
                  example: P@ssw0rd2026
                rememberMe:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Login successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Incorrect username or password.
        '403':
          description: User account deactivated.
        '423':
          description: User account is temporarily locked due to brute-force protection.

  /auth/me:
    get:
      summary: Get current authenticated user details
      description: Returns information about the currently logged-in user including effective RBAC permissions.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized.

  /auth/change-password:
    put:
      summary: Change password
      description: Logged-in users can update their passwords.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password changed successfully.
        '400':
          description: Invalid current password or weak new password.

  /auth/force-change-password:
    put:
      summary: Force change password on first login
      description: Required when the user registers or has their password reset by an administrator.
      tags:
        - Authentication
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password forced-change successful.

  /auth/forgot-password:
    post:
      summary: Request password reset
      description: Allows a user to request password reset. Flags their account so the admin can reset it manually.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Always returns a generic success message to prevent user enumeration.

  /auth/reset-password:
    post:
      summary: Reset password with token
      description: Resets password using a valid reset token generated by password reset flow.
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  format: password
      responses:
        '200':
          description: Password reset successfully.
        '400':
          description: Invalid/expired token or password policy mismatch.

  # --- User Management ---
  /users:
    get:
      summary: Get all users
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users fetched.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a user
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateInput'
      responses:
        '201':
          description: User created.

  /users/reset-requests-count:
    get:
      summary: Count pending password reset requests
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Count of users who requested a password reset.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer

  /users/{userId}:
    put:
      summary: Update a user account
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateInput'
      responses:
        '200':
          description: User updated.

  /users/{userId}/reset-password:
    post:
      summary: Admin manual reset password for user
      description: Generates a temporary random password for user, sets mustChangePassword flag, and emails them.
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Password reset successful.

  /users/{userId}/deactivate:
    put:
      summary: Deactivate user account
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - deactivationReason
              properties:
                deactivationReason:
                  type: string
                  example: "Left the company"
      responses:
        '200':
          description: Account deactivated successfully.

  /users/{userId}/reactivate:
    put:
      summary: Reactivate user account
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Account reactivated successfully.

  /users/{userId}/warehouses:
    get:
      summary: Get warehouses assigned to a user
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of assigned warehouse nodes.
    post:
      summary: Assign a warehouse to a user
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - warehouseNodeId
              properties:
                warehouseNodeId:
                  type: integer
      responses:
        '200':
          description: Warehouse node successfully assigned to user.

  /users/{userId}/warehouses/{warehouseNodeId}:
    delete:
      summary: Unassign a warehouse from a user
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: warehouseNodeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Warehouse unassigned successfully.

  /users/{userId}/permissions:
    get:
      summary: Get detailed permissions override for user
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User permission overrides fetched.
    put:
      summary: Save individual permission overrides for user
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - permissions
              properties:
                permissions:
                  type: array
                  items:
                    type: object
                    properties:
                      action:
                        type: string
                      allowed:
                        type: boolean
      responses:
        '200':
          description: Permissions saved.
    delete:
      summary: Reset permission overrides to role default
      tags:
        - Users
      security:
        - BearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Permission overrides deleted.

  # --- Categories ---
  /categories:
    get:
      summary: Get all product categories
      tags:
        - Categories
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of categories.
    post:
      summary: Create a category
      tags:
        - Categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Category created.

  /categories/{id}:
    put:
      summary: Update a category
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Category updated.
    delete:
      summary: Delete a category
      tags:
        - Categories
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Category deleted.

  # --- Products ---
  /products:
    get:
      summary: Get all products
      tags:
        - Products
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of products.
    post:
      summary: Create a product
      tags:
        - Products
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Product created.

  /products/{id}:
    put:
      summary: Update a product
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '200':
          description: Product updated.
    delete:
      summary: Delete a product
      tags:
        - Products
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product deleted.

  # --- Warehouses (Nodes) ---
  /warehouses:
    get:
      summary: Get hierarchical warehouse nodes
      tags:
        - Warehouses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of nodes.
    post:
      summary: Create a warehouse node
      description: Create a node of type warehouse, zone, aisle, rack, or bin.
      tags:
        - Warehouses
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseNodeInput'
      responses:
        '201':
          description: Warehouse node created.

  /warehouses/{id}:
    put:
      summary: Update warehouse node
      tags:
        - Warehouses
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarehouseNodeInput'
      responses:
        '200':
          description: Updated.
    delete:
      summary: Delete warehouse node
      tags:
        - Warehouses
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted.

  # --- Receipts (Goods Inward) ---
  /receipts:
    get:
      summary: List goods receipt notes
      tags:
        - Receipts
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of receipts.
    post:
      summary: Create draft receipt note
      tags:
        - Receipts
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                ghiChu:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - product
                      - quantity
                      - price
                      - warehouseNode
                    properties:
                      product:
                        type: integer
                        description: Product ID
                      quantity:
                        type: integer
                      price:
                        type: number
                      warehouseNode:
                        type: integer
                        description: Warehouse Node ID
      responses:
        '201':
          description: Receipt draft created.

  /receipts/{id}:
    put:
      summary: Edit/Approve/Reject receipt note
      description: Allows editor to change details in draft. If status is updated, triggers permissions checks to approve/reject.
      tags:
        - Receipts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ghiChu:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product:
                        type: integer
                      quantity:
                        type: integer
                      price:
                        type: number
                      warehouseNode:
                        type: integer
                status:
                  type: string
                  enum: [draft, approved, completed, rejected]
                reason:
                  type: string
                  description: Reason required when status is rejected.
      responses:
        '200':
          description: Updated successfully.

  /receipts/{id}/complete:
    put:
      summary: Complete receipt and log warehouse locations
      description: Performed by Warehouse Staff to record physical location allocations, increase stock, and write stock cards.
      tags:
        - Receipts
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - receiptItemId
                      - warehouseNodeId
                    properties:
                      receiptItemId:
                        type: integer
                      warehouseNodeId:
                        type: integer
      responses:
        '200':
          description: Completed successfully, inventory updated.

  # --- Delivery Requests ---
  /delivery-requests:
    get:
      summary: Get delivery requests
      description: Sales see only their own requests. Warehouse managers/accountants see all requests.
      tags:
        - Delivery Requests
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of delivery requests.
    post:
      summary: Create delivery request (Sales only)
      tags:
        - Delivery Requests
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - expectedDeliveryDate
                - items
              properties:
                customerId:
                  type: integer
                tenKhachHang:
                  type: string
                  description: Optional manual customer name if customerId is null.
                expectedDeliveryDate:
                  type: string
                  format: date
                note:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: integer
                      quantity:
                        type: integer
                      priceEstimate:
                        type: number
      responses:
        '201':
          description: Delivery request created.

  /delivery-requests/{id}:
    get:
      summary: Get delivery request by ID
      tags:
        - Delivery Requests
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request details.

  /delivery-requests/{id}/check-stock:
    post:
      summary: Verify inventory stock availability for delivery request
      description: Triggers availability checking across all bins. Automatically transitions status to insufficient_stock if inventory is low.
      tags:
        - Delivery Requests
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Inventory availability report.

  /delivery-requests/{id}/cancel:
    patch:
      summary: Cancel delivery request
      tags:
        - Delivery Requests
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Request cancelled.

  /delivery-requests/{id}/status:
    patch:
      summary: Update delivery request status manually (Accountants/Managers only)
      tags:
        - Delivery Requests
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [processing, completed, cancelled]
      responses:
        '200':
          description: Status updated.

  # --- Deliveries (Goods Outward) ---
  /deliveries:
    get:
      summary: List physical delivery notes
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of delivery notes.
    post:
      summary: Create physical delivery note (Draft)
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryInput'
      responses:
        '201':
          description: Draft delivery note created.

  /deliveries/{id}:
    put:
      summary: Update draft delivery details
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryInput'
      responses:
        '200':
          description: Updated successfully.

  /deliveries/{id}/submit:
    patch:
      summary: Submit physical delivery note for approval
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Submitted.

  /deliveries/{id}/approve:
    patch:
      summary: Approve physical delivery note
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Approved.

  /deliveries/{id}/reject:
    patch:
      summary: Reject physical delivery note
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Rejected.

  /deliveries/{id}/ship:
    patch:
      summary: Confirm physical items loaded (approved -> shipping)
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Shipped.

  /deliveries/{id}/complete:
    patch:
      summary: Complete physical delivery (shipping -> completed)
      description: Automatically deducts warehouse stock and logs stock card entries.
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Completed, stock updated.

  # --- Inventory & Stock Cards ---
  /inventory:
    get:
      summary: Get current inventory levels in nodes
      tags:
        - Inventory
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current stock list.

  /stock-cards:
    get:
      summary: Get stock card history log
      tags:
        - Stock Cards
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of stock card transactions.
    post:
      summary: Create manual adjustment stock card
      tags:
        - Stock Cards
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockCardManualInput'
      responses:
        '201':
          description: Card created.

  /stock-cards/{id}:
    put:
      summary: Edit manual adjustment stock card
      tags:
        - Stock Cards
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockCardManualInput'
      responses:
        '200':
          description: Updated.
    delete:
      summary: Delete manual adjustment stock card
      tags:
        - Stock Cards
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted.

  # --- Stocktake (Inventory Counts) ---
  /stocktakes:
    get:
      summary: List inventory counts (stocktake)
      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List.
    post:
      summary: Create inventory count task
      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeInput'
      responses:
        '201':
          description: Created.

  /stocktakes/{id}:
    put:
      summary: Update inventory count details
      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StocktakeInput'
      responses:
        '200':
          description: Updated.
    delete:
