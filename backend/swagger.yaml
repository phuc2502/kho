          description: List of reports.

  /stocktake-reports/{id}:
    get:
      summary: Get stocktake report details
      tags:
        - Stocktake Reports
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detailed report.

  # --- Adjustments ---
  /adjustments:
    get:
      summary: List inventory adjustment vouchers
      tags:
        - Adjustments
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of adjustments.
    post:
      summary: Create manual adjustment voucher
      tags:
        - Adjustments
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                reason:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - warehouseNodeId
                      - qtyChange
                    properties:
                      productId:
                        type: integer
                      warehouseNodeId:
                        type: integer
                      qtyChange:
                        type: integer
                        description: Positive or negative change.
      responses:
        '201':
          description: Adjustment created.

  /adjustments/{id}/approve:
    put:
      summary: Approve adjustment and apply changes directly to stock
      tags:
        - Adjustments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Approved and inventory values synced.

  /adjustments/{id}:
    delete:
      summary: Cancel/Delete draft adjustment voucher
      tags:
        - Adjustments
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted successfully.

  # --- Incidents ---
  /incidents:
