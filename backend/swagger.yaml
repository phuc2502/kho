      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Submitted.

  /stocktakes/{id}/approve:
    put:
      summary: Approve stocktake results
      description: Verifies matched counts. If discrepancies exist, automatically triggers the creation of Stocktake Minutes for adjustment.
      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Approved.

  /stocktakes/{id}/reject:
    patch:
      summary: Reject stocktake count
      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rejected.

  /stocktakes/{id}/complete-counting:
    patch:
      summary: Complete physical counting step
      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Completed.

  # --- Stocktake Minutes ---
  /stocktake-minutes:
    get:
