      tags:
        - Stocktake Minutes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Minute details.

  /stocktake-minutes/{id}/approve:
    patch:
      summary: Approve minutes and automatically generate Inventory Adjustments
      tags:
        - Stocktake Minutes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Approved and adjustments created.

  /stocktake-minutes/{id}/reject:
    patch:
      summary: Reject discrepancy minutes
      tags:
