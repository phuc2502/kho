components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthResponse:
      type: object
      properties:
        _id:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
        permissions:
          type: array
          items:
            type: string
        mustChangePassword:
          type: boolean
        token:
          type: string

    User:
      type: object
      properties:
        _id:
          type: integer
        username:
          type: string
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
        isActive:
          type: boolean
        position:
          type: string
        mustChangePassword:
          type: boolean

    UserCreateInput:
      type: object
      required:
        - username
        - email
        - password
        - role
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [Admin, QuanLyKho, KeToanKho, NhanVienKho, QC, Sale]
        fullName:
          type: string
        phone:
          type: string
        position:
          type: string

    UserUpdateInput:
      type: object
      properties:
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
        position:
          type: string
        role:
          type: string
          enum: [Admin, QuanLyKho, KeToanKho, NhanVienKho, QC, Sale]

    ProductInput:
      type: object
      required:
        - sku
        - name
        - priceIn
        - priceOut
        - category
      properties:
        sku:
          type: string
          example: SKU-10293
        name:
          type: string
          example: iPhone 15 Pro Max
        description:
          type: string
        priceIn:
          type: number
          example: 1000
        priceOut:
          type: number
          example: 1200
        unit:
          type: string
          default: Cái
          example: Cái
        category:
          type: integer
          description: Category ID

    WarehouseNodeInput:
      type: object
      required:
        - name
        - code
        - type
      properties:
        name:
          type: string
          example: Zone A
        code:
          type: string
          example: ZA
        type:
          type: string
          enum: [warehouse, zone, aisle, rack, bin]
        parentId:
          type: integer

    DeliveryInput:
      type: object
      required:
        - deliveryRequestId
        - items
      properties:
        deliveryRequestId:
          type: integer
        ghiChu:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - quantity
              - warehouseNodeId
            properties:
              productId:
                type: integer
              quantity:
                type: integer
              warehouseNodeId:
                type: integer

    StockCardManualInput:
      type: object
      required:
        - productId
        - warehouseNodeId
        - qtyChange
        - type
      properties:
        productId:
          type: integer
        warehouseNodeId:
          type: integer
        qtyChange:
          type: integer
        type:
          type: string
          enum: [import, export]
        note:
          type: string

    StocktakeInput:
      type: object
      required:
        - date
        - items
      properties:
        date:
          type: string
          format: date
        note:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - productId
              - warehouseNodeId
              - countedQty
            properties:
              productId:
                type: integer
              warehouseNodeId:
                type: integer
              countedQty:
                type: integer

    IncidentInput:
      type: object
      required:
        - productId
        - warehouseNodeId
        - quantity
        - type
      properties:
        productId:
          type: integer
        warehouseNodeId:
          type: integer
        quantity:
          type: integer
        type:
          type: string
          enum: [damage, loss]
        note:
          type: string

    CustomerInput:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
        name:
          type: string
        phone:
          type: string
        address:
          type: string
