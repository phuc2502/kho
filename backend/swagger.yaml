      tags:
        - Stocktakes
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted.

  /stocktakes/{id}/submit:
    patch:
